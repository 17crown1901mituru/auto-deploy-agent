name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "android-overlay/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Embed this repository's URL (used by the in-app Termux setup command)
        run: sed -i "s|__REPO_URL__|https://github.com/${GITHUB_REPOSITORY}.git|" frontend/index.html

      - name: Install npm dependencies
        run: npm install

      - name: Generate Android project (Capacitor)
        run: npx cap add android

      - name: Apply Termux launcher plugin and manifest changes
        run: python3 scripts/prepare_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/auto-deploy-agent-debug.apk
          ls -l output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-deploy-agent-debug-apk
          path: output/auto-deploy-agent-debug.apk
          if-no-files-found: error
